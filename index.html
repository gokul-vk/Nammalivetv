<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Namm Live TV - Official Download</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #0b0f19; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #151c2c; border: 1px solid #263147; border-radius: 16px; padding: 36px 28px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5); }
    h1 { font-size: 26px; margin-bottom: 8px; color: #38bdf8; }
    .version-badge { display: inline-block; background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 5px 14px; border-radius: 20px; font-size: 14px; font-weight: 600; margin-bottom: 20px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin-bottom: 26px; }
    .download-btn { display: block; width: 100%; background: linear-gradient(135deg, #0284c7, #2563eb); color: #ffffff; text-decoration: none; padding: 15px 20px; border-radius: 10px; font-size: 16px; font-weight: bold; }
    .footer { margin-top: 20px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Namm Live TV</h1>
    <div class="version-badge" id="versionText">Version 5.0</div>
    <p id="notesText">Tamil Nadu Local TV Channels Live Streaming App</p>
    <a href="https://gokul-vk.github.io/Nammlivetv/nammlivetv.apk" class="download-btn" download>
      Download Latest APK
    </a>
    <div class="footer">SHREE INFO TECH</div>
  </div>
  <script>
    fetch('update.json?t=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        if (data.versionName) document.getElementById('versionText').textContent = 'Version ' + data.versionName;
        if (data.releaseNotes) document.getElementById('notesText').textContent = data.releaseNotes;
      })
      .catch(() => {});
  </script>
</body>
</html>
